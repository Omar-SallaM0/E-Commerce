<section>
  <div class="container my-8">
    <h1 class="my-3 font-bold capitalize">login form</h1>
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <!-- Email -->
      <div class="field">
        <p-inputGroup>
          <p-inputGroupAddon>
            <i class="pi pi-envelope"></i>
          </p-inputGroupAddon>
          <input
            pInputText
            formControlName="username"
            placeholder="username"
            [autofocus]="true"
          />
        </p-inputGroup>
        <div class="validation-msg">
          @if (username.touched&& username.dirty) { @if (username.getError('required')) {
          <p-messages
            [value]="[
              {
                severity: 'error',
                summary: 'validation error',
                detail: 'username is required'
              }
            ]"
            [enableService]="false"
            [closable]="false"
          />
          } }
        </div>
      </div>
      <!-- Password -->
      <div class="field">
        <p-inputGroup>
          <p-inputGroupAddon>
            <i class="pi pi-lock"></i>
          </p-inputGroupAddon>
          <input
            pInputText
            type="password"
            formControlName="password"
            placeholder="password"
          />
        </p-inputGroup>
        <div class="validation-msg">
          @if (password.dirty && password.touched) { @if
          (password.getError('required')) {
          <p-messages
            [value]="[
              {
                severity: 'error',
                summary: 'validation error',
                detail: 'password is required'
              }
            ]"
            [enableService]="false"
            [closable]="false"
          />
          } @if (password.getError('minlength')) {
          <p-messages
            [value]="[
              {
                severity: 'error',
                summary: 'validation error',
                detail: 'must be at least 3 char'
              }
            ]"
            [enableService]="false"
            [closable]="false"
          />
          } @if (password.getError('maxlength')) {
          <p-messages
            [value]="[
              {
                severity: 'error',
                summary: 'validation error',
                detail: 'cannot exceed 20 char'
              }
            ]"
            [enableService]="false"
            [closable]="false"
          />
          } }
        </div>
      </div>
      <p-button type="submit" label="Login" />
    </form>
  </div>
</section>
